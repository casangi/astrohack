# Run MacOS tests using the shared template (nrao/gh-actions-templates-public).
name: MacOS Tests

on:
  # push:
  #   paths-ignore:
  #     - '**.md'
  #     - '**.rst'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'

jobs:
  call-testing-macos:
    uses: nrao/gh-actions-templates-public/.github/workflows/python-testing-macos-template.yml@main
    with:
      # TODO: add "3.14" once casacoretables publishes cp314 macOS wheels.
      # Its sdist needs bison >= 3 and flex, which the macOS runners lack.
      python-versions: '["3.12", "3.13"]'
